openapi: 3.0.3
info:
  title: LIFE RPG API
  version: 0.1.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Crée ou récupère le jeton du compte après authentification.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Supprime le jeton courant et renvoie une réponse vide.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Renvoie l'identifiant et le nom d'utilisateur.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/character/:
    get:
      operationId: character_retrieve
      description: Renvoie le personnage complet de l'utilisateur connecté.
      tags:
      - character
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
    patch:
      operationId: character_partial_update
      description: Modifie les seules données de profil autorisées.
      tags:
      - character
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/character/avatar/:
    patch:
      operationId: character_avatar_partial_update
      description: Modifie l'avatar puis renvoie le personnage complet.
      tags:
      - character
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/transactions/:
    get:
      operationId: economy_transactions_list
      description: Historique paginé des transactions de crédits.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditTransactionList'
          description: ''
  /api/economy/wallet/:
    get:
      operationId: economy_wallet_retrieve
      description: Renvoie le nombre de crédits actuellement détenus.
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Renvoie l'état de santé de l'application LIFE RPG.
      summary: Santé de l'API
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/journal/:
    get:
      operationId: journal_list
      description: Historique paginé des événements de l'utilisateur connecté.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - journal
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalEntryList'
          description: ''
  /api/journal/rest/:
    post:
      operationId: journal_rest_create
      description: Consigne l'événement REST et renvoie son message.
      tags:
      - journal
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponse'
          description: ''
  /api/progression/:
    get:
      operationId: progression_retrieve
      description: Renvoie niveau, rang, XP et points de compétence.
      tags:
      - progression
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
          description: ''
  /api/progression/history/:
    get:
      operationId: progression_history_list
      description: Historique paginé des gains d'XP du personnage.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - progression
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedXPTransactionList'
          description: ''
  /api/progression/skills/:
    get:
      operationId: progression_skills_retrieve
      description: Renvoie le solde et les transactions de points.
      tags:
      - progression
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPointsResponse'
          description: ''
  /api/quests/:
    get:
      operationId: quests_list
      description: Renvoie la liste paginée et filtrée des missions.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestList'
          description: ''
    post:
      operationId: quests_create
      description: Crée une mission en laissant le moteur calculer les récompenses.
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/:
    get:
      operationId: quests_retrieve
      description: Renvoie une mission appartenant à l'utilisateur connecté.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
    put:
      operationId: quests_update
      description: Modifie une mission active, comme la méthode PATCH.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
    patch:
      operationId: quests_partial_update
      description: Modifie une mission active en ignorant les champs serveur.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuestUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuestUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuestUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/abandon/:
    post:
      operationId: quests_abandon_create
      description: Abandonne la mission sans retirer la moindre XP.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/accept/:
    post:
      operationId: quests_accept_create
      description: Fait passer une mission disponible ou en pause au statut accepté.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/complete/:
    post:
      operationId: quests_complete_create
      description: Valide la mission et renvoie le résultat exact du moteur.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResult'
          description: ''
  /api/quests/{id}/steps/{step_id}/toggle/:
    post:
      operationId: quests_steps_toggle_create
      description: Coche ou décoche une étape d'une mission encore active.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: step_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/settings/game/:
    get:
      operationId: settings_game_retrieve
      description: Renvoie les barèmes et seuils utilisés par le moteur.
      tags:
      - settings
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSettings'
          description: ''
  /api/world/progress/:
    get:
      operationId: world_progress_retrieve
      description: Renvoie le niveau, le rang et les territoires du personnage.
      tags:
      - world
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldProgress'
          description: ''
  /api/world/territories/:
    get:
      operationId: world_territories_list
      description: Renvoie les six territoires du personnage.
      tags:
      - world
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerritoryStat'
          description: ''
  /api/world/territories/{id}/:
    get:
      operationId: world_territories_retrieve
      description: Renvoie le territoire demandé et les missions encore actives.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - world
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritoryDetail'
          description: ''
components:
  schemas:
    Avatar:
      type: object
      description: Apparence minimaliste renvoyée dans le Character.
      properties:
        silhouette:
          type: string
        color:
          type: string
        accent:
          type: string
      required:
      - accent
      - color
      - silhouette
    Character:
      type: object
      description: Objet Character complet du contrat d'API.
      properties:
        pseudonym:
          type: string
        bio:
          type: string
        character_class:
          type: string
        is_onboarded:
          type: boolean
        level:
          type: integer
        xp_in_level:
          type: integer
        xp_required:
          type: integer
        total_xp:
          type: integer
        rank:
          $ref: '#/components/schemas/Rank'
        credits:
          type: integer
        skill_points:
          $ref: '#/components/schemas/SkillPoints'
        avatar:
          $ref: '#/components/schemas/Avatar'
        stats:
          type: array
          items:
            $ref: '#/components/schemas/TerritoryStat'
      required:
      - avatar
      - bio
      - character_class
      - credits
      - is_onboarded
      - level
      - pseudonym
      - rank
      - skill_points
      - stats
      - total_xp
      - xp_in_level
      - xp_required
    CharacterClassEnum:
      enum:
      - ARCHITECT
      - CREATOR
      - EXPLORER
      - STRATEGIST
      - INNOVATOR
      type: string
      description: |-
        * `ARCHITECT` - Architecte
        * `CREATOR` - Créateur
        * `EXPLORER` - Explorateur
        * `STRATEGIST` - Stratège
        * `INNOVATOR` - Innovateur
    CompleteQuestInput:
      type: object
      description: Note facultative jointe à une validation.
      properties:
        note:
          type: string
          default: ''
    CompletionResult:
      type: object
      description: Réponse complète de la route de validation d'une mission.
      properties:
        quest:
          $ref: '#/components/schemas/Quest'
        result:
          $ref: '#/components/schemas/CompletionResultDetail'
      required:
      - quest
      - result
    CompletionResultDetail:
      type: object
      description: Récompenses et messages renvoyés après une validation.
      properties:
        xp:
          type: integer
        credits:
          type: integer
        territory:
          type: string
        level_before:
          type: integer
        level_after:
          type: integer
        levels_gained:
          type: integer
        skill_points_gained:
          type: integer
        message:
          type: string
        level_message:
          type: string
          nullable: true
      required:
      - credits
      - level_after
      - level_before
      - level_message
      - levels_gained
      - message
      - skill_points_gained
      - territory
      - xp
    CreditTransaction:
      type: object
      description: Ligne de l'historique des crédits.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CreditTransactionKindEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        balance_after:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - balance_after
      - created_at
      - kind
      - reason
      - uuid
    CreditTransactionKindEnum:
      enum:
      - EARN
      - SPEND
      type: string
      description: |-
        * `EARN` - Gain
        * `SPEND` - Dépense
    DifficultyEnum:
      enum:
      - TRIVIAL
      - EASY
      - MEDIUM
      - HARD
      - EPIC
      - LEGENDARY
      type: string
      description: |-
        * `TRIVIAL` - Très facile
        * `EASY` - Facile
        * `MEDIUM` - Moyenne
        * `HARD` - Difficile
        * `EPIC` - Épique
        * `LEGENDARY` - Légendaire
    EventTypeEnum:
      enum:
      - QUEST_CREATED
      - QUEST_UPDATED
      - QUEST_ACCEPTED
      - QUEST_STEP_DONE
      - QUEST_STEP_UNDONE
      - QUEST_COMPLETED
      - QUEST_ABANDONED
      - XP_AWARDED
      - LEVEL_UP
      - CREDITS_EARNED
      - SKILL_POINTS_EARNED
      - REST
      - CHARACTER_UPDATED
      type: string
      description: |-
        * `QUEST_CREATED` - Mission créée
        * `QUEST_UPDATED` - Mission modifiée
        * `QUEST_ACCEPTED` - Mission acceptée
        * `QUEST_STEP_DONE` - Étape cochée
        * `QUEST_STEP_UNDONE` - Étape décochée
        * `QUEST_COMPLETED` - Mission validée
        * `QUEST_ABANDONED` - Mission abandonnée
        * `XP_AWARDED` - XP attribuée
        * `LEVEL_UP` - Niveau gagné
        * `CREDITS_EARNED` - Crédits gagnés
        * `SKILL_POINTS_EARNED` - Points de compétence gagnés
        * `REST` - Repos
        * `CHARACTER_UPDATED` - Personnage modifié
    GameSettings:
      type: object
      description: Paramètres du jeu exposés en lecture seule.
      properties:
        xp_by_difficulty:
          readOnly: true
        credits_per_xp:
          type: integer
          readOnly: true
        skill_points_per_level:
          type: integer
          readOnly: true
        territory_stat_divisor:
          type: integer
          readOnly: true
        territory_stat_display_max:
          type: integer
          readOnly: true
        territory_state_thresholds:
          readOnly: true
        ranks:
          readOnly: true
      required:
      - credits_per_xp
      - ranks
      - skill_points_per_level
      - territory_stat_display_max
      - territory_stat_divisor
      - territory_state_thresholds
      - xp_by_difficulty
    HealthResponse:
      type: object
      description: Forme de la réponse de l'endpoint de santé.
      properties:
        status:
          type: string
        app:
          type: string
        version:
          type: string
      required:
      - app
      - status
      - version
    JournalEntry:
      type: object
      description: Événement du journal, tel que décrit dans le contrat d'API.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        actor:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        payload:
          readOnly: true
        quest:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - event_type
      - message
      - payload
      - quest
      - uuid
    Login:
      type: object
      description: Identifiants acceptés par la route de connexion.
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      description: Jeton créé et identité du compte connecté.
      properties:
        token:
          type: string
