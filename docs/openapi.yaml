    EventTypeEnum:
      enum:
      - QUEST_CREATED
      - QUEST_UPDATED
      - QUEST_RESCHEDULED
      - QUEST_ACCEPTED
      - QUEST_STEP_DONE
      - QUEST_STEP_UNDONE
      - QUEST_COMPLETED
      - QUEST_ABANDONED
      - XP_AWARDED
      - LEVEL_UP
      - CREDITS_EARNED
      - SKILL_POINTS_EARNED
      - REST
      - CHARACTER_UPDATED
      - SKILL_UNLOCKED
      - ACHIEVEMENT_UNLOCKED
      - REWARD_PURCHASED
      - ITEM_EQUIPPED
      - ITEM_UNEQUIPPED
      - SEASON_STARTED
      - SEASON_CLOSED
      - SEASON_UPDATED
      - TITLE_CHANGED
      - AGENT_TOKEN_CREATED
      - AGENT_TOKEN_REVOKED
      - AGENT_CONTEXT_READ
      - QUEST_PROPOSED
      - PROPOSAL_ACCEPTED
      - PROPOSAL_REJECTED
      - PROPOSAL_UPDATED
      - ENERGY_CHECKIN
      type: string
      description: |-
        * `QUEST_CREATED` - Mission créée
        * `QUEST_UPDATED` - Mission modifiée
        * `QUEST_RESCHEDULED` - Mission replanifiée
        * `QUEST_ACCEPTED` - Mission acceptée
        * `QUEST_STEP_DONE` - Étape cochée
        * `QUEST_STEP_UNDONE` - Étape décochée
        * `QUEST_COMPLETED` - Mission validée
        * `QUEST_ABANDONED` - Mission abandonnée
        * `XP_AWARDED` - XP attribuée
        * `LEVEL_UP` - Niveau gagné
        * `CREDITS_EARNED` - Crédits gagnés
        * `SKILL_POINTS_EARNED` - Points de compétence gagnés
        * `REST` - Repos
        * `CHARACTER_UPDATED` - Personnage modifié
        * `SKILL_UNLOCKED` - Compétence débloquée
        * `ACHIEVEMENT_UNLOCKED` - Succès débloqué
        * `REWARD_PURCHASED` - Récompense obtenue
        * `ITEM_EQUIPPED` - Objet équipé
        * `ITEM_UNEQUIPPED` - Objet retiré
        * `SEASON_STARTED` - Saison commencée
        * `SEASON_CLOSED` - Saison terminée
        * `SEASON_UPDATED` - Saison mise à jour
        * `TITLE_CHANGED` - Titre changé
        * `AGENT_TOKEN_CREATED` - Jeton d'agent créé
        * `AGENT_TOKEN_REVOKED` - Jeton d'agent révoqué
        * `AGENT_CONTEXT_READ` - Contexte lu par un agent
        * `QUEST_PROPOSED` - Missions proposées
        * `PROPOSAL_ACCEPTED` - Proposition acceptée
        * `PROPOSAL_REJECTED` - Proposition refusée
        * `PROPOSAL_UPDATED` - Proposition mise à jour
        * `ENERGY_CHECKIN` - Bilan énergétique
