openapi: 3.0.3
info:
  title: LIFE RPG API
  version: 0.1.0
  description: API locale de LIFE RPG. Les agents de code s'authentifient avec un
    jeton Bearer lra_… et n'accèdent qu'aux endpoints /api/agent/.
paths:
  /api/achievements/:
    get:
      operationId: achievements_list
      description: Renvoie tous les succès avec leur état.
      tags:
      - achievements
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'
          description: ''
  /api/agent/calendar/:
    get:
      operationId: agent_calendar
      description: Renvoie le calendrier autorisé par les portées du jeton d'agent.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Premier jour inclus (AAAA-MM-JJ). Semaine ISO courante par défaut.
      - in: query
        name: to
        schema:
          type: string
        description: Dernier jour inclus (AAAA-MM-JJ). Semaine ISO courante par défaut.
      tags:
      - agent
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarRangeResponse'
          description: ''
  /api/agent/context/:
    get:
      operationId: agent_context
      description: Renvoie le contexte selon les portées du jeton, sans BODY sans
        portée body.
      tags:
      - agent
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContext'
          description: ''
  /api/agent/quest-proposals/:
    get:
      operationId: agent_proposals_list
      description: Renvoie les propositions créées par ce jeton, des plus récentes
        aux plus anciennes.
      tags:
      - agent
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestProposal'
          description: ''
    post:
      operationId: agent_proposals_create
      description: 'Une proposition (objet) ou plusieurs via {"proposals": [...]}
        (10 max). Les champs serveur (status, xp_preview, quest…) sont ignorés.'
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestProposalInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestProposalInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestProposalInput'
        required: true
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestProposal'
          description: ''
  /api/analytics/insights/:
    get:
      operationId: analytics_insights
      description: Renvoie charge, territoires négligés et suggestions du jour.
      tags:
      - analytics
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insights'
          description: ''
  /api/auth/agent-tokens/:
    get:
      operationId: agent_tokens_list
      description: Renvoie tous les jetons du compte, révoqués compris, sans secret.
      tags:
      - auth
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentToken'
          description: ''
    post:
      operationId: agent_tokens_create
      description: Crée un jeton ; le secret complet n'est renvoyé qu'à la création.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTokenCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentTokenCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentTokenCreate'
        required: true
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenCreateResponse'
          description: ''
  /api/auth/agent-tokens/{id}/:
    delete:
      operationId: agent_tokens_revoke
      description: Révoque le jeton (204) ; il reste listé avec is_active à false.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Crée ou récupère le jeton du compte après authentification.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Supprime le jeton courant et renvoie une réponse vide.
      tags:
      - auth
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: me_retrieve
      description: Renvoie l'identifiant, le nom et le fuseau de l'utilisateur.
      tags:
      - auth
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_update
      description: Modifie uniquement le fuseau horaire du compte.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/calendar/:
    get:
      operationId: calendar_range
      description: Renvoie les jours, entrées et validations de la plage demandée.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Premier jour inclus (AAAA-MM-JJ). Semaine ISO courante par défaut.
      - in: query
        name: to
        schema:
          type: string
        description: Dernier jour inclus (AAAA-MM-JJ). Semaine ISO courante par défaut.
      tags:
      - calendar
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarRangeResponse'
          description: ''
  /api/calendar/today/:
    get:
      operationId: calendar_today
      description: Renvoie le jour courant, ses validations et l'avancement hebdomadaire.
      tags:
      - calendar
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarTodayResponse'
          description: ''
  /api/character/:
    get:
      operationId: character_retrieve
      description: Renvoie le personnage complet de l'utilisateur connecté.
      tags:
      - character
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
    patch:
      operationId: character_partial_update
      description: Modifie les seules données de profil autorisées.
      tags:
      - character
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/character/avatar/:
    patch:
      operationId: character_avatar_partial_update
      description: Modifie l'avatar puis renvoie le personnage complet.
      tags:
      - character
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/inventory/:
    get:
      operationId: economy_inventory_retrieve
      description: Renvoie les objets possédés et l'historique d'achats.
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
          description: ''
  /api/economy/inventory/{id}/equip/:
    post:
      operationId: economy_inventory_equip_create
      description: Équipe l'objet possédé correspondant.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/inventory/{id}/unequip/:
    post:
      operationId: economy_inventory_unequip_create
      description: Retire l'objet équipé correspondant.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/rewards/:
    get:
      operationId: economy_rewards_list
      description: Renvoie les objets boutique visibles par le joueur.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: slot
        schema:
          type: string
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShopItem'
          description: ''
    post:
      operationId: economy_rewards_create
      description: Crée une récompense personnelle.
      tags:
      - economy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RewardCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RewardCreate'
        required: true
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'
          description: ''
  /api/economy/rewards/{id}/:
    patch:
      operationId: economy_rewards_partial_update
      description: Modifie une récompense personnelle appartenant au joueur.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRewardUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRewardUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRewardUpdate'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'
          description: ''
  /api/economy/rewards/{id}/purchase/:
    post:
      operationId: economy_rewards_purchase_create
      description: Achète un objet via le moteur.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
          description: ''
  /api/economy/transactions/:
    get:
      operationId: economy_transactions_list
      description: Historique paginé des transactions de crédits.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditTransactionList'
          description: ''
  /api/economy/wallet/:
    get:
      operationId: economy_wallet_retrieve
      description: Renvoie le nombre de crédits actuellement détenus.
      tags:
      - economy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/energy/:
    get:
      operationId: energy_list
      description: Renvoie la liste paginée des bilans énergétiques.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - energy
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnergyCheckInList'
          description: ''
    post:
      operationId: energy_create
      description: Bilans énergétiques paginés du joueur ; le POST remplace celui
        du jour.
      tags:
      - energy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnergyCheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnergyCheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnergyCheckIn'
        required: true
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyCheckIn'
          description: ''
  /api/export/:
    get:
      operationId: export
      description: Export JSON complet des données du joueur, sans aucun secret d'agent.
      tags:
      - export
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Renvoie l'état de santé de l'application LIFE RPG.
      summary: Santé de l'API
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/journal/:
    get:
      operationId: journal_list
      description: Renvoie la liste paginée filtrée du journal.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: event_type
        schema:
          type: array
          items:
            type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: territory
        schema:
          type: string
      tags:
      - journal
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalEntryList'
          description: ''
  /api/journal/rest/:
    post:
      operationId: journal_rest_create
      description: Consigne l'événement REST et renvoie son message.
      tags:
      - journal
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponse'
          description: ''
  /api/journal/summary/:
    get:
      operationId: journal_summary_retrieve
      description: Renvoie un résumé journalier hebdomadaire ou mensuel.
      parameters:
      - in: query
        name: period
        schema:
          type: string
      tags:
      - journal
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalSummary'
          description: ''
  /api/progression/:
    get:
      operationId: progression_retrieve
      description: Renvoie niveau, rang, XP et points de compétence.
      tags:
      - progression
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
          description: ''
  /api/progression/history/:
    get:
      operationId: progression_history_list
      description: Historique paginé des gains d'XP du personnage.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - progression
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedXPTransactionList'
          description: ''
  /api/progression/skills/:
    get:
      operationId: progression_skills_retrieve
      description: Renvoie le solde, les compétences débloquées et les transactions.
      tags:
      - progression
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPointsResponse'
          description: ''
  /api/quest-proposals/:
    get:
      operationId: quest_proposals_list
      description: Renvoie les propositions du compte, filtrables par statut.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      tags:
      - quest-proposals
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestProposalList'
          description: ''
  /api/quest-proposals/{id}/:
    patch:
      operationId: quest_proposals_update
      description: Modifie une proposition en attente ; 409 si elle est déjà décidée.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quest-proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuestProposalUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuestProposalUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuestProposalUpdate'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestProposal'
          description: ''
  /api/quest-proposals/{id}/accept/:
    post:
      operationId: quest_proposals_accept
      description: Accepte avec modifications facultatives ; la mission ne rapporte
        rien encore.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quest-proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestProposalUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestProposalUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestProposalUpdate'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalAcceptResponse'
          description: ''
  /api/quest-proposals/{id}/reject/:
    post:
      operationId: quest_proposals_reject
      description: Refuse la proposition avec un motif facultatif ; 409 si déjà décidée.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quest-proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRejectInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProposalRejectInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProposalRejectInput'
      security:
      - tokenAuth: []
      - AgentTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestProposal'
