    Quest:
      type: object
      description: Mission renvoyée par l'API, avec les champs calculés par le serveur.
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        territory:
          type: string
          readOnly: true
        quest_type:
          $ref: '#/components/schemas/QuestTypeEnum'
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        estimated_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        xp_reward:
          type: integer
          readOnly: true
        credit_reward:
          type: integer
          readOnly: true
        validation_mode:
          $ref: '#/components/schemas/ValidationModeEnum'
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        skill_branch:
          type: string
          maxLength: 40
        is_recurring:
          type: boolean
          description: Indique si la mission est quotidienne ou hebdomadaire.
          readOnly: true
        period_key:
          type: string
          description: Calcule la clé de période du jour local.
          readOnly: true
        completed_this_period:
          type: boolean
          description: Indique si la mission a déjà été validée dans la période courante.
          readOnly: true
        completions_count:
          type: integer
          description: Compte toutes les validations enregistrées pour la mission.
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/QuestStep'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
