openapi: 3.0.3
info:
  title: LIFE RPG API
  version: 0.1.0
paths:
  /api/achievements/:
    get:
      operationId: achievements_list
      description: Renvoie tous les succès avec leur état.
      tags:
      - achievements
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Crée ou récupère le jeton du compte après authentification.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Supprime le jeton courant et renvoie une réponse vide.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Renvoie l'identifiant et le nom d'utilisateur.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/character/:
    get:
      operationId: character_retrieve
      description: Renvoie le personnage complet de l'utilisateur connecté.
      tags:
      - character
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
    patch:
      operationId: character_partial_update
      description: Modifie les seules données de profil autorisées.
      tags:
      - character
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCharacterUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/character/avatar/:
    patch:
      operationId: character_avatar_partial_update
      description: Modifie l'avatar puis renvoie le personnage complet.
      tags:
      - character
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAvatarUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/inventory/:
    get:
      operationId: economy_inventory_retrieve
      description: Renvoie les objets possédés et l'historique d'achats.
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
          description: ''
  /api/economy/inventory/{id}/equip/:
    post:
      operationId: economy_inventory_equip_create
      description: Équipe l'objet possédé correspondant.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/inventory/{id}/unequip/:
    post:
      operationId: economy_inventory_unequip_create
      description: Retire l'objet équipé correspondant.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
          description: ''
  /api/economy/rewards/:
    get:
      operationId: economy_rewards_list
      description: Renvoie les objets boutique visibles par le joueur.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: slot
        schema:
          type: string
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShopItem'
          description: ''
    post:
      operationId: economy_rewards_create
      description: Crée une récompense personnelle.
      tags:
      - economy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RewardCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RewardCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'
          description: ''
  /api/economy/rewards/{id}/:
    patch:
      operationId: economy_rewards_partial_update
      description: Modifie une récompense personnelle appartenant au joueur.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRewardUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRewardUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRewardUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItem'
          description: ''
  /api/economy/rewards/{id}/purchase/:
    post:
      operationId: economy_rewards_purchase_create
      description: Achète un objet via le moteur.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
          description: ''
  /api/economy/transactions/:
    get:
      operationId: economy_transactions_list
      description: Historique paginé des transactions de crédits.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditTransactionList'
          description: ''
  /api/economy/wallet/:
    get:
      operationId: economy_wallet_retrieve
      description: Renvoie le nombre de crédits actuellement détenus.
      tags:
      - economy
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Renvoie l'état de santé de l'application LIFE RPG.
      summary: Santé de l'API
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/journal/:
    get:
      operationId: journal_list
      description: Renvoie la liste paginée filtrée du journal.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: event_type
        schema:
          type: array
          items:
            type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: territory
        schema:
          type: string
      tags:
      - journal
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalEntryList'
          description: ''
  /api/journal/rest/:
    post:
      operationId: journal_rest_create
      description: Consigne l'événement REST et renvoie son message.
      tags:
      - journal
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponse'
          description: ''
  /api/journal/summary/:
    get:
      operationId: journal_summary_retrieve
      description: Renvoie un résumé journalier hebdomadaire ou mensuel.
      parameters:
      - in: query
        name: period
        schema:
          type: string
      tags:
      - journal
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalSummary'
          description: ''
  /api/progression/:
    get:
      operationId: progression_retrieve
      description: Renvoie niveau, rang, XP et points de compétence.
      tags:
      - progression
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
          description: ''
  /api/progression/history/:
    get:
      operationId: progression_history_list
      description: Historique paginé des gains d'XP du personnage.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - progression
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedXPTransactionList'
          description: ''
  /api/progression/skills/:
    get:
      operationId: progression_skills_retrieve
      description: Renvoie le solde, les compétences débloquées et les transactions.
      tags:
      - progression
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPointsResponse'
          description: ''
  /api/quests/:
    get:
      operationId: quests_list
      description: Renvoie la liste paginée et filtrée des missions.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestList'
          description: ''
    post:
      operationId: quests_create
      description: Crée une mission en laissant le moteur calculer les récompenses.
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/:
    get:
      operationId: quests_retrieve
      description: Renvoie une mission appartenant à l'utilisateur connecté.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
    put:
      operationId: quests_update
      description: Modifie une mission active, comme la méthode PATCH.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
    patch:
      operationId: quests_partial_update
      description: Modifie une mission active en ignorant les champs serveur.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuestUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuestUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuestUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/abandon/:
    post:
      operationId: quests_abandon_create
      description: Abandonne la mission sans retirer la moindre XP.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/accept/:
    post:
      operationId: quests_accept_create
      description: Fait passer une mission disponible ou en pause au statut accepté.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/quests/{id}/complete/:
    post:
      operationId: quests_complete_create
      description: Valide la mission et renvoie le résultat exact du moteur.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteQuestInput'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResult'
          description: ''
  /api/quests/{id}/steps/{step_id}/toggle/:
    post:
      operationId: quests_steps_toggle_create
      description: Coche ou décoche une étape d'une mission encore active.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: step_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - quests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/seasons/:
    get:
      operationId: seasons_list
      description: Renvoie les saisons du joueur, la plus récente d'abord.
      tags:
      - seasons
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonListResponse'
          description: ''
    post:
      operationId: seasons_create
      description: Crée une nouvelle saison.
      tags:
      - seasons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SeasonCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SeasonCreate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
          description: ''
  /api/seasons/{id}/:
    get:
      operationId: seasons_retrieve
      description: Renvoie une saison du joueur.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - seasons
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
          description: ''
    patch:
      operationId: seasons_partial_update
      description: Met à jour une saison active.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - seasons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSeasonUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSeasonUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSeasonUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
          description: ''
  /api/seasons/{id}/close/:
    post:
      operationId: seasons_close_create
      description: Clôt la saison et ouvre la suivante.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - seasons
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonCloseResponse'
          description: ''
  /api/seasons/current/:
    get:
      operationId: seasons_current_retrieve
      description: Renvoie la saison active après clôture/ouverture automatiques.
      tags:
      - seasons
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
          description: ''
  /api/settings/game/:
    get:
      operationId: settings_game_retrieve
      description: Renvoie les barèmes et seuils utilisés par le moteur.
      tags:
      - settings
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSettings'
          description: ''
  /api/skills/{code}/unlock/:
    post:
      operationId: skills_unlock_create
      description: Débloque la compétence demandée via le moteur.
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[a-z_.0-9]+$
        required: true
      tags:
      - skills
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillUnlockResponse'
          description: ''
  /api/skills/trees/:
    get:
      operationId: skills_trees_list
      description: Renvoie les arbres de compétences, éventuellement filtrés par territoire.
      parameters:
      - in: query
        name: territory
        schema:
          type: string
      tags:
      - skills
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillTree'
          description: ''
  /api/world/progress/:
    get:
      operationId: world_progress_retrieve
      description: Renvoie le niveau, le rang et les territoires du personnage.
      tags:
      - world
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldProgress'
          description: ''
  /api/world/territories/:
    get:
      operationId: world_territories_list
      description: Renvoie les six territoires du personnage.
      tags:
      - world
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerritoryStat'
          description: ''
  /api/world/territories/{id}/:
    get:
      operationId: world_territories_retrieve
      description: Renvoie le territoire demandé et les missions encore actives.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - world
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritoryDetail'
          description: ''
components:
  schemas:
    Achievement:
      type: object
      description: Succès avec état de déblocage pour le joueur.
      properties:
        code:
          type: string
        name:
          type: string
        label:
          type: string
        description:
          type: string
        unlocked:
          type: boolean
        unlocked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - code
      - description
      - label
      - name
      - unlocked
      - unlocked_at
    Avatar:
      type: object
      description: Apparence minimaliste renvoyée dans le Character.
      properties:
        silhouette:
          type: string
        color:
          type: string
        accent:
          type: string
      required:
      - accent
      - color
      - silhouette
    Character:
      type: object
      description: Objet Character complet du contrat d'API.
      properties:
        pseudonym:
          type: string
        bio:
          type: string
        character_class:
          type: string
        is_onboarded:
          type: boolean
        level:
          type: integer
        xp_in_level:
          type: integer
        xp_required:
          type: integer
        total_xp:
          type: integer
        rank:
          $ref: '#/components/schemas/Rank'
        credits:
          type: integer
        skill_points:
          $ref: '#/components/schemas/SkillPoints'
        avatar:
          $ref: '#/components/schemas/Avatar'
        stats:
          type: array
          items:
            $ref: '#/components/schemas/TerritoryStat'
        active_title:
          type: string
          nullable: true
        titles:
          type: array
          items:
            type: string
        equipment:
          $ref: '#/components/schemas/Equipment'
      required:
      - active_title
      - avatar
      - bio
      - character_class
      - credits
      - equipment
      - is_onboarded
      - level
      - pseudonym
      - rank
      - skill_points
      - stats
      - titles
      - total_xp
      - xp_in_level
      - xp_required
    CharacterClassEnum:
      enum:
      - ARCHITECT
      - CREATOR
      - EXPLORER
      - STRATEGIST
      - INNOVATOR
      type: string
      description: |-
        * `ARCHITECT` - Architecte
        * `CREATOR` - Créateur
        * `EXPLORER` - Explorateur
        * `STRATEGIST` - Stratège
        * `INNOVATOR` - Innovateur
    CompleteQuestInput:
      type: object
      description: Note facultative jointe à une validation.
      properties:
        note:
          type: string
          default: ''
    CompletionAchievement:
      type: object
      description: Succès débloqué lors d'une validation.
      properties:
        code:
          type: string
        label:
          type: string
      required:
      - code
      - label
    CompletionResult:
      type: object
      description: Réponse complète de la route de validation d'une mission.
      properties:
        quest:
          $ref: '#/components/schemas/Quest'
        result:
          $ref: '#/components/schemas/CompletionResultDetail'
      required:
      - quest
      - result
    CompletionResultDetail:
      type: object
      description: Récompenses et messages renvoyés après une validation.
      properties:
        xp:
          type: integer
        credits:
          type: integer
        territory:
          type: string
        level_before:
          type: integer
        level_after:
          type: integer
        levels_gained:
          type: integer
        skill_points_gained:
          type: integer
        message:
          type: string
        level_message:
          type: string
          nullable: true
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/CompletionAchievement'
      required:
      - achievements
      - credits
      - level_after
      - level_before
      - level_message
      - levels_gained
      - message
      - skill_points_gained
      - territory
      - xp
    CreditTransaction:
      type: object
      description: Ligne de l'historique des crédits.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CreditTransactionKindEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        balance_after:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - balance_after
      - created_at
      - kind
      - reason
      - uuid
    CreditTransactionKindEnum:
      enum:
      - EARN
      - SPEND
      type: string
      description: |-
        * `EARN` - Gain
        * `SPEND` - Dépense
    DifficultyEnum:
      enum:
      - TRIVIAL
      - EASY
      - MEDIUM
      - HARD
      - EPIC
      - LEGENDARY
      type: string
      description: |-
        * `TRIVIAL` - Très facile
        * `EASY` - Facile
        * `MEDIUM` - Moyenne
        * `HARD` - Difficile
        * `EPIC` - Épique
        * `LEGENDARY` - Légendaire
    Equipment:
      type: object
      description: Équipement cosmétique par emplacement.
      properties:
        AURA:
          allOf:
          - $ref: '#/components/schemas/ShopItemSnapshot'
          nullable: true
        FRAME:
          allOf:
          - $ref: '#/components/schemas/ShopItemSnapshot'
          nullable: true
        EMBLEM:
          allOf:
          - $ref: '#/components/schemas/ShopItemSnapshot'
          nullable: true
      required:
      - AURA
      - EMBLEM
      - FRAME
    EventTypeEnum:
      enum:
      - QUEST_CREATED
      - QUEST_UPDATED
      - QUEST_ACCEPTED
      - QUEST_STEP_DONE
      - QUEST_STEP_UNDONE
      - QUEST_COMPLETED
      - QUEST_ABANDONED
      - XP_AWARDED
      - LEVEL_UP
      - CREDITS_EARNED
      - SKILL_POINTS_EARNED
      - REST
      - CHARACTER_UPDATED
      - SKILL_UNLOCKED
      - ACHIEVEMENT_UNLOCKED
      - REWARD_PURCHASED
      - ITEM_EQUIPPED
      - ITEM_UNEQUIPPED
      - SEASON_STARTED
      - SEASON_CLOSED
      - SEASON_UPDATED
      - TITLE_CHANGED
      type: string
      description: |-
        * `QUEST_CREATED` - Mission créée
        * `QUEST_UPDATED` - Mission modifiée
        * `QUEST_ACCEPTED` - Mission acceptée
        * `QUEST_STEP_DONE` - Étape cochée
        * `QUEST_STEP_UNDONE` - Étape décochée
        * `QUEST_COMPLETED` - Mission validée
        * `QUEST_ABANDONED` - Mission abandonnée
        * `XP_AWARDED` - XP attribuée
        * `LEVEL_UP` - Niveau gagné
        * `CREDITS_EARNED` - Crédits gagnés
        * `SKILL_POINTS_EARNED` - Points de compétence gagnés
        * `REST` - Repos
        * `CHARACTER_UPDATED` - Personnage modifié
        * `SKILL_UNLOCKED` - Compétence débloquée
        * `ACHIEVEMENT_UNLOCKED` - Succès débloqué
        * `REWARD_PURCHASED` - Récompense obtenue
        * `ITEM_EQUIPPED` - Objet équipé
        * `ITEM_UNEQUIPPED` - Objet retiré
        * `SEASON_STARTED` - Saison commencée
        * `SEASON_CLOSED` - Saison terminée
        * `SEASON_UPDATED` - Saison mise à jour
        * `TITLE_CHANGED` - Titre changé
    GameSettings:
      type: object
      description: Paramètres du jeu exposés en lecture seule.
      properties:
        xp_by_difficulty:
          readOnly: true
        credits_per_xp:
          type: integer
          readOnly: true
        skill_points_per_level:
          type: integer
          readOnly: true
        territory_stat_divisor:
          type: integer
          readOnly: true
        territory_stat_display_max:
          type: integer
          readOnly: true
        territory_state_thresholds:
          readOnly: true
        ranks:
          readOnly: true
      required:
      - credits_per_xp
      - ranks
      - skill_points_per_level
      - territory_stat_display_max
      - territory_stat_divisor
      - territory_state_thresholds
      - xp_by_difficulty
    HealthResponse:
      type: object
      description: Forme de la réponse de l'endpoint de santé.
      properties:
        status:
          type: string
        app:
          type: string
        version:
          type: string
      required:
      - app
      - status
      - version
    InventoryPurchase:
      type: object
      description: Historique d'achat dans l'inventaire.
      properties:
        uuid:
          type: string
          format: uuid
        item_name:
          type: string
        cost:
          type: integer
        purchased_at:
          type: string
          format: date-time
      required:
      - cost
      - item_name
      - purchased_at
      - uuid
    InventoryResponse:
      type: object
      description: Inventaire du joueur.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShopItem'
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPurchase'
      required:
      - items
      - purchases
    JournalEntry:
      type: object
      description: Événement du journal, tel que décrit dans le contrat d'API.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        actor:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        payload:
          readOnly: true
        quest:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - event_type
      - message
      - payload
      - quest
      - uuid
    JournalSummary:
      type: object
      description: Résumé journalier d'une période.
      properties:
        period:
          type: string
        from_:
          type: string
          format: date
          title: 'From '
        to:
          type: string
          format: date
        xp_by_day:
          type: array
          items:
            $ref: '#/components/schemas/JournalSummaryDay'
        xp_by_territory:
          type: object
          additionalProperties:
            type: integer
        completions:
          type: integer
        rests:
          type: integer
        achievements:
          type: integer
        skills:
          type: integer
      required:
      - achievements
      - completions
      - from_
      - period
      - rests
      - skills
      - to
      - xp_by_day
      - xp_by_territory
    JournalSummaryDay:
      type: object
      description: XP d'un jour pour le résumé journal.
      properties:
        date:
          type: string
          format: date
        xp:
          type: integer
      required:
      - date
      - xp
    Login:
      type: object
      description: Identifiants acceptés par la route de connexion.
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      description: Jeton créé et identité du compte connecté.
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    OriginEnum:
      enum:
      - USER
      - AI
      type: string
      description: |-
        * `USER` - Utilisateur
        * `AI` - Agent
    PaginatedCreditTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreditTransaction'
    PaginatedJournalEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
    PaginatedQuestList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Quest'
    PaginatedXPTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/XPTransaction'
    PatchedAvatarUpdate:
      type: object
      description: Champs de l'avatar acceptés en PATCH.
      properties:
        silhouette:
          $ref: '#/components/schemas/SilhouetteEnum'
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        accent:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
    PatchedCharacterUpdate:
      type: object
      description: Champs de profil modifiables ; la progression est ignorée.
      properties:
        pseudonym:
          type: string
          maxLength: 40
        bio:
          type: string
        character_class:
          $ref: '#/components/schemas/CharacterClassEnum'
        is_onboarded:
          type: boolean
        active_title:
          type: string
          nullable: true
          maxLength: 80
    PatchedQuestUpdate:
      type: object
      description: Champs modifiables d'une mission active ; le reste est ignoré.
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        territory:
          type: string
          maxLength: 20
        quest_type:
          $ref: '#/components/schemas/QuestTypeEnum'
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        estimated_minutes:
          type: integer
          minimum: 0
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        validation_mode:
          $ref: '#/components/schemas/ValidationModeEnum'
        skill_branch:
          type: string
          maxLength: 40
    PatchedRewardUpdate:
      type: object
      description: Mise à jour d'une récompense personnelle.
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
        cost:
          type: integer
          minimum: 1
        is_available:
          type: boolean
    PatchedSeasonUpdate:
      type: object
      description: Mise à jour d'une saison active.
      properties:
        name:
          type: string
          maxLength: 120
        theme:
          type: string
          maxLength: 200
        priority_territories:
          type: array
          items:
            type: string
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/SeasonObjectiveInput'
    PriorityEnum:
      enum:
      - LOW
      - NORMAL
      - HIGH
      type: string
      description: |-
        * `LOW` - Faible
        * `NORMAL` - Normale
        * `HIGH` - Haute
    Progression:
      type: object
      description: Résumé de progression générale du personnage.
      properties:
        level:
          type: integer
        xp_in_level:
          type: integer
        xp_required:
          type: integer
        total_xp:
          type: integer
        rank:
          $ref: '#/components/schemas/Rank'
        skill_points:
          $ref: '#/components/schemas/SkillPoints'
      required:
      - level
      - rank
      - skill_points
      - total_xp
      - xp_in_level
      - xp_required
    PurchaseResponse:
      type: object
      description: Réponse d'achat.
      properties:
        item:
          $ref: '#/components/schemas/ShopItem'
        credits:
          type: integer
        message:
          type: string
      required:
      - credits
      - item
      - message
    Quest:
      type: object
      description: Mission renvoyée par l'API, avec les champs calculés par le serveur.
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        territory:
          type: string
          readOnly: true
        quest_type:
          $ref: '#/components/schemas/QuestTypeEnum'
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        estimated_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        xp_reward:
          type: integer
          readOnly: true
        credit_reward:
          type: integer
          readOnly: true
        validation_mode:
          $ref: '#/components/schemas/ValidationModeEnum'
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        skill_branch:
          type: string
          maxLength: 40
        is_recurring:
          type: boolean
          description: Indique si la mission est quotidienne ou hebdomadaire.
          readOnly: true
        period_key:
          type: string
          description: Calcule la clé de période du jour local.
          readOnly: true
        completed_this_period:
          type: boolean
          description: Indique si la mission a déjà été validée dans la période courante.
          readOnly: true
        completions_count:
          type: integer
          description: Compte toutes les validations enregistrées pour la mission.
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/QuestStep'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - completed_at
      - completed_this_period
      - completions_count
      - created_at
      - credit_reward
      - id
      - is_recurring
      - origin
      - period_key
      - status
      - steps
      - territory
      - title
      - updated_at
      - uuid
      - xp_reward
    QuestCreate:
      type: object
      description: Données acceptées à la création ; les champs serveur sont ignorés.
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
        territory:
          type: string
          maxLength: 20
        quest_type:
          allOf:
          - $ref: '#/components/schemas/QuestTypeEnum'
          default: SIDE
        difficulty:
          allOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          default: MEDIUM
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: NORMAL
        estimated_minutes:
          type: integer
          minimum: 0
          default: 0
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        validation_mode:
          allOf:
          - $ref: '#/components/schemas/ValidationModeEnum'
          default: MANUAL
        skill_branch:
          type: string
          default: ''
          maxLength: 40
        steps:
          type: array
          items:
            $ref: '#/components/schemas/QuestStepInput'
      required:
      - territory
      - title
    QuestStep:
      type: object
      description: Étape d'une mission, sans récompense propre.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
        is_required:
          type: boolean
          readOnly: true
        is_done:
          type: boolean
          readOnly: true
        done_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - done_at
      - id
      - is_done
      - is_required
      - order
      - title
    QuestStepInput:
      type: object
      description: Étape envoyée lors de la création d'une mission composée.
      properties:
        title:
          type: string
          maxLength: 200
        is_required:
          type: boolean
          default: true
        order:
          type: integer
          minimum: 0
      required:
      - title
    QuestTypeEnum:
      enum:
      - DAILY
      - WEEKLY
      - MAIN
      - SIDE
      - BOSS
      type: string
      description: |-
        * `DAILY` - Quotidienne
        * `WEEKLY` - Hebdomadaire
        * `MAIN` - Principale
        * `SIDE` - Secondaire
        * `BOSS` - Boss
    QuestUpdate:
      type: object
      description: Champs modifiables d'une mission active ; le reste est ignoré.
      properties:
        title:
          type: string
