        code:
          type: string
        name:
          type: string
        territory:
          type: string
        unlocked_at:
          type: string
          format: date-time
      required:
      - code
      - name
      - territory
      - unlocked_at
    User:
      type: object
      description: Identité minimale d'un compte renvoyée par l'API.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
      required:
      - id
      - username
    ValidationModeEnum:
      enum:
      - MANUAL
      - PROOF
      type: string
      description: |-
        * `MANUAL` - Manuelle
        * `PROOF` - Avec preuve
