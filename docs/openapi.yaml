  securitySchemes:
    AgentTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: lra_…
      description: 'Jeton d''agent LIFE RPG : en-tête Authorization: Bearer lra_…'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
