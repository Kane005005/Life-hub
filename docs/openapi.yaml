components:
  schemas:
    Achievement:
      type: object
      description: Succès avec état de déblocage pour le joueur.
      properties:
        code:
          type: string
        name:
          type: string
        label:
          type: string
        description:
          type: string
        unlocked:
          type: boolean
        unlocked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - code
      - description
      - label
      - name
      - unlocked
      - unlocked_at
    AgentActiveQuest:
      type: object
      description: Mission active résumée pour le contexte d'agent.
      properties:
        id:
          type: integer
        title:
          type: string
        territory:
          type: string
        quest_type:
          type: string
        difficulty:
          type: string
        status:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
        skill_branch:
          type: string
      required:
      - difficulty
      - due_date
      - id
      - quest_type
      - skill_branch
      - status
      - territory
      - title
    AgentContext:
      type: object
      description: 'Contexte borné d''un agent : seules les clés de ses portées sont
        présentes.'
      properties:
        agent:
          type: string
        scopes:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/AgentProfile'
        progression:
          $ref: '#/components/schemas/AgentProgression'
        quests:
          $ref: '#/components/schemas/AgentQuests'
        skills:
          $ref: '#/components/schemas/AgentSkills'
        seasons:
          $ref: '#/components/schemas/AgentSeasons'
        journal:
          type: array
          items:
            $ref: '#/components/schemas/AgentJournalEntry'
        energy:
          type: array
          items:
            $ref: '#/components/schemas/EnergyCheckIn'
        proposals:
          $ref: '#/components/schemas/AgentProposalsSummary'
      required:
      - agent
      - generated_at
      - scopes
    AgentContextBranch:
      type: object
      description: Branche de compétences résumée, sans le détail des nœuds.
      properties:
        code:
          type: string
        name:
          type: string
        validated_quests:
          type: integer
      required:
      - code
      - name
      - validated_quests
    AgentContextTree:
      type: object
      description: Arbre de compétences résumé pour le contexte d'agent.
      properties:
        territory:
          type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/AgentContextBranch'
      required:
      - branches
      - territory
    AgentJournalEntry:
      type: object
      description: Événement du journal résumé pour le contexte d'agent.
      properties:
        event_type:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - event_type
      - message
    AgentProfile:
      type: object
      description: Profil minimal lisible avec la portée profile.
      properties:
        pseudonym:
          type: string
        character_class:
          type: string
        level:
          type: integer
        rank:
          $ref: '#/components/schemas/Rank'
        active_title:
          type: string
          nullable: true
      required:
      - active_title
      - character_class
      - level
      - pseudonym
      - rank
    AgentProgression:
      type: object
      description: Progression lisible avec la portée progression.
      properties:
        level:
          type: integer
        xp_in_level:
          type: integer
        xp_required:
          type: integer
        total_xp:
          type: integer
        territories:
          type: array
          items:
            $ref: '#/components/schemas/TerritoryStat'
        insights:
          $ref: '#/components/schemas/Insights'
      required:
      - insights
      - level
      - territories
      - total_xp
      - xp_in_level
      - xp_required
    AgentProposalsSummary:
      type: object
      description: File d'attente des propositions, lisible avec la portée proposals.
      properties:
        pending:
          type: integer
      required:
      - pending
    AgentQuests:
      type: object
      description: Missions actives et validations récentes, bornées.
      properties:
        active:
          type: array
          items:
            $ref: '#/components/schemas/AgentActiveQuest'
        recent_completions:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecentCompletion'
      required:
      - active
      - recent_completions
    AgentRecentCompletion:
      type: object
      description: Validation récente résumée pour le contexte d'agent.
      properties:
        title:
          type: string
        territory:
          type: string
        completed_at:
          type: string
          format: date-time
      required:
      - completed_at
      - territory
      - title
    AgentSeasons:
      type: object
      description: Saison active lisible avec la portée seasons.
      properties:
        current:
          allOf:
          - $ref: '#/components/schemas/Season'
          nullable: true
      required:
      - current
    AgentSkills:
      type: object
      description: Compétences lisibles avec la portée skills.
      properties:
        available_points:
          type: integer
        unlocked:
          type: array
          items:
            $ref: '#/components/schemas/AgentUnlockedSkill'
        trees:
          type: array
          items:
            $ref: '#/components/schemas/AgentContextTree'
      required:
      - available_points
      - trees
      - unlocked
    AgentToken:
      type: object
      description: Jeton d'agent renvoyé par l'API, sans le secret ni son empreinte.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        prefix:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - name
      - prefix
      - revoked_at
      - scopes
    AgentTokenCreate:
      type: object
      description: Données acceptées à la création d'un jeton ; portées inconnues
        refusées.
      properties:
        name:
          type: string
          maxLength: 60
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
      required:
      - name
    AgentTokenCreateResponse:
      type: object
      description: 'Réponse de création : le secret complet n''apparaît qu''une seule
        fois.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        prefix:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        token:
          type: string
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - name
      - prefix
      - revoked_at
      - scopes
      - token
    AgentUnlockedSkill:
      type: object
      description: Compétence débloquée, résumée pour le contexte d'agent.
      properties:
        code:
          type: string
        name:
          type: string
        territory:
          type: string
      required:
      - code
      - name
      - territory
    Avatar:
      type: object
      description: Apparence minimaliste renvoyée dans le Character.
      properties:
        silhouette:
          type: string
        color:
          type: string
        accent:
          type: string
      required:
      - accent
      - color
      - silhouette
    CalendarCompletion:
      type: object
      description: Validation réellement enregistrée, avec ses montants figés.
      properties:
        quest_id:
